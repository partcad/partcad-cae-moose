# The MOOSE implementations of PartCAD's four analyses.
#
# The structure is identical to `//builtin/export` and `//builtin/render` -- see
# `docs/source/config_output.rst` in the `partcad` repository for what each field
# means. What makes these analyses is the section they are declared in: `cae:`.
# Each writes binary glTF, the result being a 3D field the Digital Thread turns
# and zooms, and answers with `findings` beside it: an empty list is a pass, and
# is what `pc test` requires.
#
# MOOSE is a framework for coupled physics, and these four are the simplest
# things it does: solid mechanics static and modal, heat conduction, and
# laminar incompressible flow, each from one input file.

name: //pub/feature/cae/moose
desc: |
  Static stress, modal, steady heat transfer and laminar flow analysis, by
  [MOOSE](https://mooseframework.inl.gov/).

  Each analysis meshes the part with gmsh -- the faces each port covers named --
  writes a MOOSE input file and runs a MOOSE application built with every
  physics module. The answer is a coloured model and measurements, and findings
  when a threshold is crossed.

# What the scripts import. Declared even though the image carries gmsh, because
# `dockerImage` says where the analyses run *best*, not where they run at all: a
# host with MOOSE installed runs this package in a conda or venv sandbox like
# any other. MOOSE itself is a native program, not a Python package: that is
# what the image is for, or a local installation (see README.md).
pythonRequirements:
  - gmsh; platform_machine != "aarch64"
  - numpy

cae:
  fea:
    desc: A linear static stress analysis, as a glTF coloured by von Mises stress plus findings.
    path: fea_moose.py
    extension: glb
    # MOOSE from INL's conda channel on PartCAD's base image, amd64 only. The tag
    # is a hash of what the image is built from (see `image-tag.sh`), and PartCAD
    # appends the architecture.
    dockerImage: ghcr.io/partcad/partcad-cae-moose:16aa61c025b2
    # What this implementation reads of a part's 'fea:' beyond where each
    # condition lands and how big it is: a load's direction ('force', a load
    # written as [x, y, z] in the part's frame) and the part's own 'gravity:'.
    # PartCAD refuses to hand either to an implementation that does not say it
    # reads it, rather than have it answered as if it had not been written --
    # every load straight down, the part weighed the way it is drawn.
    reads: [force, gravity]

    # The mesh: the largest tetrahedron as a fraction of the part's largest
    # dimension, and quadratic elements and displacements -- linear ones are far
    # too stiff in bending.
    mesh_size: 0.05
    mesh_order: 2

    # The material, when the package says nothing else: steel. Pascals, and
    # kg/m^3. Note the signed exponents: YAML 1.1 reads `2.1e11` as a string.
    youngs_modulus: 2.1e+11
    poissons_ratio: 0.30
    yield_strength: 2.5e+8
    density: 7850

    # What counts as a finding: a stress past the yield strength divided by
    # `safety_factor`, and a displacement past `max_displacement` (mm).
    safety_factor: 1.5
    max_displacement: 1.0

    # Whether the part's own weight acts on it too: 9.81 m/s^2 along -Z, unless
    # the part states 'gravity:' in its 'fea:', which replaces this.
    self_weight: true

  dynamic:
    desc: The natural frequencies of the part as it is held, as a glTF of its first mode shape plus findings.
    path: dynamic_moose.py
    extension: glb
    dockerImage: ghcr.io/partcad/partcad-cae-moose:16aa61c025b2
    mesh_size: 0.05
    mesh_order: 2
    youngs_modulus: 2.1e+11
    poissons_ratio: 0.30
    density: 7850
    # How many of the lowest modes to find.
    modes: 6
    # A first natural frequency under this (Hz) is a finding. Unset by default.
    # min_frequency: 100

  thermal:
    desc: Steady heat conduction through the part, as a glTF coloured by temperature plus findings.
    path: thermal_moose.py
    extension: glb
    dockerImage: ghcr.io/partcad/partcad-cae-moose:16aa61c025b2
    mesh_size: 0.05
    mesh_order: 2
    # W/(m*K) -- steel -- and the temperature (Celsius) `convection:` cools
    # towards.
    conductivity: 50.0
    ambient_temperature: 20.0
    # A part hotter than this anywhere (Celsius) is a finding. Unset by default.
    # max_temperature: 85

  cfd:
    desc: Steady laminar incompressible flow through the part, as a glTF coloured by pressure plus findings.
    path: cfd_moose.py
    extension: glb
    dockerImage: ghcr.io/partcad/partcad-cae-moose:16aa61c025b2
    # How long a solve may be silent before PartCAD's client gives up on it, in
    # seconds: a flow is the slowest analysis there is, and the client's default
    # is five minutes. PartCAD announces this window while the analysis runs.
    timeout: 1800
    # Linear elements: PSPG and SUPG stabilize equal-order velocity and pressure.
    mesh_size: 0.05
    # The fluid: air at 20 degrees. kg/m^3, and the dynamic viscosity in Pa*s.
    density: 1.204
    viscosity: 1.82e-5
    # How many Newton iterations the steady state may take.
    iterations: 30
    # What counts as a finding, besides a flow too fast to be laminar.
    max_velocity: 50.0
    # min_flow_rate: 1.0e-6
